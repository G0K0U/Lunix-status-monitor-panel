name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile mps_pressure_dashboard.py pc008_control.py pc008_experiment.py plot_pc008_waterblock.py
      - run: python -m unittest -v
